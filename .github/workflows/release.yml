name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            fabric/build/libs/*.jar
            neoforge/build/libs/*.jar
            !**/*sources*.jar
            !**/*javadoc*.jar
          generate_release_notes: true

      - name: Publish Fabric to CurseForge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: 1722361
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Use Local Recipes ${{ github.ref_name }}
          version-type: release
          game-versions: 1.21.10
          changelog: ${{ github.event.head_commit.message }}
          loaders: fabric
          environment: client
          files: |
            fabric/build/libs/*.jar
            !fabric/build/libs/*sources*.jar
            !fabric/build/libs/*javadoc*.jar

      - name: Publish NeoForge to CurseForge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: 1722361
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Use Local Recipes ${{ github.ref_name }}
          version-type: release
          game-versions: 1.21.10
          changelog: ${{ github.event.head_commit.message }}
          loaders: neoforge
          environment: client
          files: |
            neoforge/build/libs/*.jar
            !neoforge/build/libs/*sources*.jar
            !neoforge/build/libs/*javadoc*.jar
