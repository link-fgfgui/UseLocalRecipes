name: Release

on:
  push:
    tags:
      - 'v*'
      - '[0-9]+.*'

jobs:
  release:
    name: Build & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build with Gradle
        run: ./gradlew build

      # Resolve the exact mod jar of each loader. Globbing build/libs/*.jar also picks up the
      # sources and javadoc jars, and the publishing actions would then upload them as well
      # (with an arbitrary one of them becoming the primary file on CurseForge).
      - name: Collect release jars
        id: jars
        run: |
          set -euo pipefail
          mod_id=$(sed -n 's/^mod_id=//p' gradle.properties)
          mc_version=$(sed -n 's/^minecraft_version=//p' gradle.properties)
          version=$(sed -n 's/^version=//p' gradle.properties)
          mkdir -p release-assets
          for loader in fabric neoforge; do
            jar="${loader}/build/libs/${mod_id}-${loader}-${mc_version}-${version}.jar"
            if [ ! -f "${jar}" ]; then
              echo "::error::Expected mod jar not found: ${jar}"
              exit 1
            fi
            cp "${jar}" release-assets/
            echo "${loader}=release-assets/$(basename "${jar}")" >> "$GITHUB_OUTPUT"
          done
          ls -l release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*.jar
          generate_release_notes: true

      - name: Publish Fabric to CurseForge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: 1722361
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Use Local Recipes ${{ github.ref_name }}
          version-type: release
          game-versions: 1.21.11
          changelog: ${{ github.event.head_commit.message }}
          loaders: fabric
          environment: client
          files: ${{ steps.jars.outputs.fabric }}

      - name: Publish NeoForge to CurseForge
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          curseforge-id: 1722361
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          name: Use Local Recipes ${{ github.ref_name }}
          version-type: release
          game-versions: 1.21.11
          changelog: ${{ github.event.head_commit.message }}
          loaders: neoforge
          environment: client
          files: ${{ steps.jars.outputs.neoforge }}
